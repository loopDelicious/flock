[platformio]
src_dir = .

[env:xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; Generic ESP32-S3-WROOM-2 (N32R8V): 32 MB OCTAL flash + 8 MB OCTAL PSRAM, 1.8V.
; Detected via esptool flash_id: octal (8 data lines), 32MB, Macronix.
[env:esp32s3_wroom2]
platform = espressif32@^6.3.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM

build_src_filter = +<main.cpp>

; opi_opi = octal flash + octal PSRAM (the WROOM-2 difference vs the XIAO's qio_opi)
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
